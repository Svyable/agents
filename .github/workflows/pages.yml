name: Validate public ecosystem
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate discovery surfaces
        run: |
          python3 scripts/build.py
          python3 scripts/validate.py
          node --check docs/app.js
          git diff --exit-code -- index.html docs/index.html docs/agent-index.json docs/llms.txt llms.txt docs/sitemap.xml docs/robots.txt
