name: Validate and deploy public ecosystem
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate discovery surfaces
        run: |
          python3 scripts/build.py
          python3 scripts/validate.py
          node --check docs/app.js
          git diff --exit-code -- docs/index.html docs/agent-index.json docs/llms.txt llms.txt docs/sitemap.xml docs/robots.txt
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
